name: Build and deploy

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          APP_ENV: development
          APP_KEYS: ci-build-key
          ADMIN_JWT_SECRET: ci-build-secret
          API_TOKEN_SALT: ci-build-salt
          TRANSFER_TOKEN_SALT: ci-build-transfer
          ENCRYPTION_KEY: ci-build-encryption
          JWT_SECRET: ci-build-jwt

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Coolify
        run: |
          payload='{
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "${{ github.repository }}",
              "clone_url": "https://github.com/${{ github.repository }}.git"
            },
            "commits": [
              {
                "added": [],
                "removed": [],
                "modified": ["."]
              }
            ]
          }'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ secrets.COOLIFY_WEBHOOK_SECRET }}" | sed 's/^.* //')
          response=$(curl -s -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            -d "$payload")
          echo "$response"
          if echo "$response" | grep -q '"status":"failed"'; then
            echo "Deployment failed"
            exit 1
          fi
